<div *ngIf="loading" class="sample-container">
    <po-loading-overlay></po-loading-overlay>
</div>
<div *ngIf="!loading">
    <po-accordion class="filters-accordion po-lg-12 po-mt-2">
        <po-accordion-item p-label="Filtros">
            <div class="po-row">

                <po-select class="po-sm-12 po-md-3 po-lg-2" p-label="Empresa" name="empresa" [ngModel]="empresa"
                    (p-change)="onChangeEmpresa($event)" [p-options]="empresaOptions">
                </po-select>

                <po-select class="po-sm-12 po-md-3 po-lg-2" p-label="Filial" name="filial" [ngModel]="filial"
                    [p-disabled]="filialOptions.length <= 1" (p-change)="onChangeFilial($event)"
                    [p-options]="filialOptions">
                </po-select>

                <po-select class="po-sm-12 po-md-3 po-lg-1" p-label="Tipo" name="tipo" [ngModel]="tipo"
                    (p-change)="tipo = $event" [p-options]="tipoOptions">
                </po-select>

                <po-select class="po-sm-12 po-md-3 po-lg-1" p-label="Liquidado?" name="liquidado" [ngModel]="liquidado"
                    (p-change)="liquidado = $event" [p-options]="liquidadoOptions">
                </po-select>

                <po-input class="po-sm-12 po-md-6 po-lg-2" name="notaFiscal" [(ngModel)]="notaFiscal" p-clean
                    p-label="Nota Fiscal">
                </po-input>

                <po-input class="po-sm-12 po-md-6 po-lg-2" name="fornecedor" [(ngModel)]="fornecedor" p-clean
                    p-label="Fornecedor">
                </po-input>

                <po-select class="po-sm-12 po-md-6 po-lg-2" p-label="Papeleta" name="papeleta" [ngModel]="papeleta"
                    (p-change)="papeleta = $event" [p-options]="papeletaOptions">
                </po-select>

                <po-select class="po-sm-12 po-md-6 po-lg-1" p-label="Imprimir?" name="imprimir" [ngModel]="imprimir"
                    (p-change)="imprimir = $event" [p-options]="imprimirOptions">
                </po-select>

            </div>

            <div class="po-row po-mt-1 filters-actions">

                <po-datepicker class="po-sm-12 po-md-6 po-lg-3" name="startDate" [ngModel]="startDate"
                    (p-change)="onStartChanged($event)" p-format="dd/mm/yyyy" p-label="Data Inicial">
                </po-datepicker>

                <po-datepicker class="po-sm-12 po-md-6 po-lg-3" name="endDate" [ngModel]="endDate"
                    (p-change)="onEndChanged($event)" p-format="dd/mm/yyyy" p-label="Data Final">
                </po-datepicker>

                <div class="po-sm-12 po-md-12 po-lg-6 actions-right">
                    <po-button p-label="Filtrar" p-kind="secondary" (p-click)="filtrar()"></po-button>
                    <po-button p-label="Excel" p-kind="primary" (p-click)="exportToExcel()"></po-button>
                </div>

            </div>

        </po-accordion-item>
    </po-accordion>
    <po-accordion class="filters-accordion po-lg-12 po-mt-2 po-mb-1">
        <po-accordion-item p-label="Indicadores">
            <div class="po-row mb-4">
                <div class="po-md-12 po-lg-12">
                    <po-container class="po-lg-6 " [p-height]="435">
                        <po-chart [p-categories]="categoriasUsuarios" [p-series]="colunaItens"
                            [p-options]="chartOptions">
                        </po-chart>
                    </po-container>
                    <po-container class="po-lg-3" [p-height]="435">
                        <div class="po-font-text-bold "></div>
                        <po-chart [p-options]="chartOptions" [p-series]="pizzaItens">
                        </po-chart>
                    </po-container>
                    <po-container class="po-md-3 widgets-coluna" [p-height]="435">
                        <div class="widgets-wrapper">
                            <po-widget class="widget-card">
                                <div class="widget-value">{{ totalNotas }}</div>
                                <div class="widget-label">NFs</div>
                            </po-widget>

                            <po-widget class="widget-card">
                                <div class="widget-value">{{ mediaDiasSLA }} D</div>
                                <div class="widget-label">Média Dia</div>
                            </po-widget>

                            <po-widget class="widget-card">
                                <div class="widget-value">{{ mediaHorasSLA }} h</div>
                                <div class="widget-label">Média Horas</div>
                            </po-widget>

                            <po-widget class="widget-card destaque">
                                <div class="widget-value">{{ formatDecimalPtBr(totalHorasSLA, 2, 2) }} h</div>
                                <div class="widget-label">Horas SLA</div>
                            </po-widget>
                        </div>
                        <po-widget class="widget-card">
                            <div class="widget-value">{{ percentDentroSLA }}%</div>
                            <div class="widget-label">Dentro SLA (48h)</div>
                            <div class="widget-label">{{ totalDentroSLA }}/{{ totalNotas }} dentro SLA</div>
                        </po-widget>
                    </po-container>
                </div>
            </div>
        </po-accordion-item>
    </po-accordion>

    <div class="pager-bar">
        <div class="pager-left">
            <po-button p-label="Anterior" p-kind="tertiary" [p-disabled]="page <= 1" (p-click)="prevPage()">
            </po-button>

            <po-button p-label="Próxima" p-kind="tertiary" [p-disabled]="page >= totalPages" (p-click)="nextPage()">
            </po-button>

            <span class="pager-info">
                Página <b>{{ page }}</b> / <b>{{ totalPages }}</b>
                <span class="po-ml-1">•</span>
                Total: <b>{{ total }}</b>
            </span>
        </div>

        <div class="pager-right">
            <po-select class="page-size" p-label="Tamanho" [ngModel]="pageSize" (ngModelChange)="setPageSize($event)"
                [p-options]="pageSizeOptions">
            </po-select>
        </div>
    </div>

    <po-table class="rcap-table" [p-sort]="true" [p-striped]="true" [p-columns]="columns" [p-items]="items">
    </po-table>

</div>
